<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballons - WIN Sport</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .ballons-page {
            padding: 30px 20px;
        }

        .ballons-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .ballons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: auto;
        }

        .ballon-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .ballon-card img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            border-radius: 10px;
        }

        .ballon-card h2 {
            margin: 15px 0 8px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .order-btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            background: #111;
            color: white;
            font-weight: bold;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 0 auto 25px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
<img src="./Select.jpg" alt="Select" width="300">
<img src="./Hummel.jpg" alt="Hummel" width="300">
    <div class="ballons-page">

        <a class="back-btn" href="index.html">
            ← Retour à l'accueil
        </a>

        <h1 class="ballons-title">⚽ Nos Ballons</h1>

        <div class="ballons-grid">

            <!-- Ballon Select -->
          <div class="product-card">
    <img src="select.jpg" alt="Ballon Select">
    <h3>Ballon Select</h3>
    <p class="price">3200 DA</p>
</div>

<div class="product-card">
    <img src="hummel.jpg" alt="Ballon Hummel">
    <h3>Ballon Hummel</h3>
    <p class="price">5500 DA</p>
</div>

    </div>

</body>
</html>
