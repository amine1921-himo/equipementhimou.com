<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WIN SPORT - Ballons</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8fafc;
            color: #1e293b;
        }

        header {
            background: #38bdf8;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.10);
        }

        .logo {
            color: white;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #075985;
        }

        .hero {
            text-align: center;
            padding: 65px 20px;
            background: linear-gradient(135deg, #ffffff, #e0f7ff);
        }

        .hero h1 {
            font-size: 48px;
            color: #0284c7;
            margin-bottom: 12px;
        }

        .hero p {
            color: #64748b;
            font-size: 18px;
        }

        .products {
            padding: 55px 7%;
        }

        .products h2 {
            text-align: center;
            color: #0284c7;
            font-size: 32px;
            margin-bottom: 35px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            max-width: 900px;
            margin: auto;
        }

        .product {
            background: white;
            border: 2px solid #e0f2fe;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-6px);
            border-color: #38bdf8;
        }

        .product img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            display: block;
            margin-bottom: 15px;
            border-radius: 12px;
        }

        .product h3 {
            color: #0284c7;
            font-size: 23px;
            margin-bottom: 8px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #0f172a;
        }

        .back {
            text-align: center;
            margin: 35px 0 50px;
        }

        .back a {
            display: inline-block;
            background: #38bdf8;
            color: white;
            text-decoration: none;
            padding: 13px 28px;
            border-radius: 9px;
            font-weight: bold;
        }

        .back a:hover {
            background: #0284c7;
        }

        footer {
            background: #38bdf8;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 800px) {

            header {
                flex-direction: column;
                gap: 18px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h1 {
                font-size: 40px;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .product img {
                height: 280px;
            }
        }

    </style>

</head>

<body>

    <header>

        <div class="logo">
            WIN SPORT
        </div>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="football.html">Football</a>
        </nav>

    </header>


    <section class="hero">

        <h1>⚽ Ballons</h1>

        <p>
            Découvrez notre sélection de ballons de football.
        </p>

    </section>


    <section class="products">

        <h2>Nos Ballons</h2>

        <div class="product-grid">


            <!-- BALLON SELECT -->

            <div class="product">

                <img src="select.jpg" alt="Ballon Select">

                <h3>Ballon Select</h3>

                <p class="price">
                    3200 DA
                </p>

            </div>


            <!-- BALLON HUMMEL -->

            <div class="product">

                <img src="hummel.jpg" alt="Ballon Hummel">

                <h3>Ballon Hummel</h3>

                <p class="price">
                    5500 DA
                </p>

            </div>


        </div>

    </section>


    <div class="back">

        <a href="football.html">
            ← Retour au Football
        </a>

    </div>


    <footer>

        <p>
            © 2026 WIN SPORT — Tous droits réservés.
        </p>

    </footer>

</body>

</html>
